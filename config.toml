default_model = "kimi-code/kimi-for-coding"
default_thinking = true
merge_all_available_skills = true
telemetry = true

[providers."managed:kimi-code"]
type = "kimi"
api_key = ""
base_url = "https://api.kimi.com/coding/v1"

[providers."managed:kimi-code".oauth]
storage = "file"
key = "oauth/kimi-code"

[models."kimi-code/kimi-for-coding"]
provider = "managed:kimi-code"
model = "kimi-for-coding"
max_context_size = 262144
capabilities = [ "thinking", "image_in", "video_in", "tool_use" ]
display_name = "Kimi-k2.6"

[services.moonshot_search]
base_url = "https://api.kimi.com/coding/v1/search"
api_key = ""

[services.moonshot_search.oauth]
storage = "file"
key = "oauth/kimi-code"

[services.moonshot_fetch]
base_url = "https://api.kimi.com/coding/v1/fetch"
api_key = ""

[services.moonshot_fetch.oauth]
storage = "file"
key = "oauth/kimi-code"

[[hooks]]
event = "PreToolUse"
matcher = "Shell|WriteFile|StrReplaceFile"
command = "bash ~/.kimi-code/hooks/security-guard.sh"
timeout = 5

[[hooks]]
event = "SessionStart"
command = "bash ~/.kimi-code/hooks/session-start.sh"
timeout = 10

[[hooks]]
event = "UserPromptSubmit"
command = "bash ~/.kimi-code/hooks/skill-forced-eval.sh"
timeout = 10

[[hooks]]
event = "SessionEnd"
command = "bash ~/.kimi-code/hooks/session-summary.sh"
timeout = 15

[[hooks]]
event = "Stop"
command = "bash ~/.kimi-code/hooks/stop-summary.sh"
timeout = 10
